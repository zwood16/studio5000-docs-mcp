[project]
name = "studio5000-docs-mcp"
version = "0.1.0"
description = "MCP server that indexes the Studio 5000 Logix Designer v37 help (Oxygen WebHelp) into SQLite FTS5 and exposes search and read tools"
readme = "README.md"
authors = [
    { name = "Zac Wood", email = "zwood@a-i-corp.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3",
    "platformdirs>=4.14.5",
    "selectolax>=1.0.2",
]

[project.scripts]
studio5000-docs-mcp = "studio5000_docs_mcp:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real Studio 5000 help install (set S5K_HELP_ROOT)"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# The rule categories to enable.
select = [
    "E",   # pycodestyle (catches formatting-adjacent errors)
    "F",   # Pyflakes (catches logical errors, like unused variables)
    "I",   # isort (automatically sorts your imports)
    "UP",  # pyupgrade (suggests modern syntax upgrades)
    "B",   # flake8-bugbear (catches common bugs and gotchas)
    "SIM", # flake8-simplify (suggests cleaner, more elegant code)
]
